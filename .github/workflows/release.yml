name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Dart protoc plugin
        run: dart pub global activate protoc_plugin

      - name: Verify proto codegen drift
        run: bash packages/snow_draw_engine/rust/scripts/check_proto_codegen_drift.sh

      - name: Build Rust WASM artifact
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path packages/snow_draw_engine/rust/Cargo.toml -p engine_wasm --target wasm32-unknown-unknown --release

      - name: Run static analysis
        run: dart run melos run analyze

      - name: Run formatting checks
        run: dart run melos run format:check

      - name: Verify core purity
        run: dart run melos run check:core-purity

      - name: Verify Rust V2 runtime cutover guards
        run: bash packages/snow_draw_engine/rust/scripts/check_runtime_v2_cutover.sh

      - name: Run test suite
        run: dart run melos run test

  build-windows:
    needs: quality-gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true
      - run: flutter --version

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Build Windows app
        run: |
          cd apps/snow_draw
          flutter build windows --release

      - name: Create Windows archive
        run: |
          cd apps/snow_draw/build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath $env:GITHUB_WORKSPACE/snow_draw-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: snow_draw-windows-x64
          path: snow_draw-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  build-web:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Build Web app
        run: |
          cd apps/snow_draw
          flutter build web --release

      - name: Create Web archive
        run: |
          cd apps/snow_draw/build/web
          tar -czf $GITHUB_WORKSPACE/snow_draw-web.tar.gz *

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: snow_draw-web
          path: snow_draw-web.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-rust-abi-linux:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust C ABI (linux)
        run: cargo build --manifest-path packages/snow_draw_engine/rust/Cargo.toml -p engine_capi --release

      - name: Package Rust C ABI (linux)
        run: |
          cd packages/snow_draw_engine/rust/target/release
          tar -czf $GITHUB_WORKSPACE/snow_draw-engine-rust-linux-x64.tar.gz \
            libsnow_draw_engine_capi.so \
            libsnow_draw_engine_capi.a

      - name: Upload Rust ABI artifact (linux)
        uses: actions/upload-artifact@v4
        with:
          name: snow_draw-engine-rust-linux-x64
          path: snow_draw-engine-rust-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-rust-abi-macos:
    needs: quality-gate
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust C ABI (macOS)
        run: cargo build --manifest-path packages/snow_draw_engine/rust/Cargo.toml -p engine_capi --release

      - name: Package Rust C ABI (macOS)
        run: |
          cd packages/snow_draw_engine/rust/target/release
          tar -czf $GITHUB_WORKSPACE/snow_draw-engine-rust-macos-arm64.tar.gz \
            libsnow_draw_engine_capi.dylib \
            libsnow_draw_engine_capi.a

      - name: Upload Rust ABI artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: snow_draw-engine-rust-macos-arm64
          path: snow_draw-engine-rust-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-rust-abi-windows:
    needs: quality-gate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust C ABI (windows)
        run: cargo build --manifest-path packages/snow_draw_engine/rust/Cargo.toml -p engine_capi --release

      - name: Package Rust C ABI (windows)
        run: |
          cd packages/snow_draw_engine/rust/target/release
          Compress-Archive -Path snow_draw_engine_capi.dll,snow_draw_engine_capi.lib -DestinationPath $env:GITHUB_WORKSPACE/snow_draw-engine-rust-windows-x64.zip

      - name: Upload Rust ABI artifact (windows)
        uses: actions/upload-artifact@v4
        with:
          name: snow_draw-engine-rust-windows-x64
          path: snow_draw-engine-rust-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  build-rust-wasm:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust WASM runtime
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path packages/snow_draw_engine/rust/Cargo.toml -p engine_wasm --target wasm32-unknown-unknown --release

      - name: Package Rust WASM runtime
        run: |
          cd packages/snow_draw_engine/rust/target/wasm32-unknown-unknown/release
          tar -czf $GITHUB_WORKSPACE/snow_draw-engine-rust-wasm.tar.gz \
            engine_wasm.wasm

      - name: Upload Rust WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: snow_draw-engine-rust-wasm
          path: snow_draw-engine-rust-wasm.tar.gz
          if-no-files-found: error
          retention-days: 14

  create-release:
    needs: [quality-gate, build-windows, build-web, build-rust-abi-linux, build-rust-abi-macos, build-rust-abi-windows, build-rust-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: snow_draw-windows-x64

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: snow_draw-web

      - name: Download Rust ABI artifact (linux)
        uses: actions/download-artifact@v4
        with:
          name: snow_draw-engine-rust-linux-x64

      - name: Download Rust ABI artifact (macOS)
        uses: actions/download-artifact@v4
        with:
          name: snow_draw-engine-rust-macos-arm64

      - name: Download Rust ABI artifact (windows)
        uses: actions/download-artifact@v4
        with:
          name: snow_draw-engine-rust-windows-x64

      - name: Download Rust WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: snow_draw-engine-rust-wasm

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Validate version format
        run: |
          version="${{ steps.get_version.outputs.version }}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid version '$version'. Expected vMAJOR.MINOR.PATCH with optional pre-release and build metadata suffixes."
            exit 1
          fi

      - name: Validate tag availability
        if: github.event_name == 'workflow_dispatch'
        run: |
          version="${{ steps.get_version.outputs.version }}"
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/$version"; then
            echo "Tag '$version' already exists. Please provide a new version."
            exit 1
          fi

      - name: Derive release channel
        id: release_channel
        run: |
          version="${{ steps.get_version.outputs.version }}"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Release Notes
        id: release_notes
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.get_version.outputs.version }}'
            });

            const repoName = context.repo.repo;
            const owner = context.repo.owner;
            const pagesUrl = repoName.endsWith('.github.io')
              ? `https://${repoName}/`
              : `https://${owner}.github.io/${repoName}/`;

            // Add custom installation instructions
            const customBody = `${data.body}

            ## Try It Online

            **[Launch Snow Draw Web App](${pagesUrl})** - Try the app directly in your browser!

            ## Downloads

            | Platform | File | Description |
            |----------|------|-------------|
            | Windows | \`snow_draw-windows-x64.zip\` | Windows x64 executable |
            | Web | \`snow_draw-web.tar.gz\` | Web application bundle |
            | Rust ABI (Linux) | \`snow_draw-engine-rust-linux-x64.tar.gz\` | C ABI library + static archive |
            | Rust ABI (macOS) | \`snow_draw-engine-rust-macos-arm64.tar.gz\` | C ABI library + static archive |
            | Rust ABI (Windows) | \`snow_draw-engine-rust-windows-x64.zip\` | C ABI dynamic library + import library |
            | Rust WASM | \`snow_draw-engine-rust-wasm.tar.gz\` | WebAssembly runtime module |

            ## Installation Instructions

            ### Windows
            1. Download \`snow_draw-windows-x64.zip\`
            2. Extract the archive to your desired location
            3. Run \`snow_draw.exe\`

            ### Web
            1. Download \`snow_draw-web.tar.gz\`
            2. Extract the archive: \`tar -xzf snow_draw-web.tar.gz\`
            3. Serve the contents with a web server (e.g., \`python -m http.server\`)

            ---
            *Built with Flutter - Released via GitHub Actions*`;

            return customBody;
          result-encoding: string

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: ${{ steps.release_channel.outputs.prerelease }}
          files: |
            snow_draw-windows-x64.zip
            snow_draw-web.tar.gz
            snow_draw-engine-rust-linux-x64.tar.gz
            snow_draw-engine-rust-macos-arm64.tar.gz
            snow_draw-engine-rust-windows-x64.zip
            snow_draw-engine-rust-wasm.tar.gz
          body: ${{ steps.release_notes.outputs.result }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
