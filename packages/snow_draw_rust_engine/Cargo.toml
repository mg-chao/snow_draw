[package]
name = "snow_draw_rust_engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust port of snow_draw_engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rstar = "0.12"
log = "0.4"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1"
