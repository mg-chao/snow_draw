[workspace]
members = [
  "crates/engine_proto",
  "crates/engine_core",
  "crates/engine_capi",
  "crates/engine_wasm",
  "crates/engine_bench",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["Snow Draw Contributors"]

[workspace.dependencies]
anyhow = "1.0"
criterion = "0.5"
prost = "0.13"
serde = "1.0"
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
