name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Dart protoc plugin
        run: dart pub global activate protoc_plugin

      - name: Verify proto codegen drift
        run: bash packages/snow_draw_engine/rust/scripts/check_proto_codegen_drift.sh

      - name: Build Rust WASM artifact
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path packages/snow_draw_engine/rust/Cargo.toml -p engine_wasm --target wasm32-unknown-unknown --release

      - name: Verify Rust benchmark targets compile
        run: cargo bench --manifest-path packages/snow_draw_engine/rust/Cargo.toml -p engine_bench --no-run

      - name: Run static analysis
        run: dart run melos run analyze

      - name: Run formatting checks
        run: dart run melos run format:check

      - name: Verify architecture boundaries
        run: dart run melos run check:architecture

      - name: Verify compatibility contracts
        run: dart run melos run check:compatibility-contracts

      - name: Verify Rust V2 runtime cutover guards
        run: bash packages/snow_draw_engine/rust/scripts/check_runtime_v2_cutover.sh

      - name: Run test suite
        run: dart run melos run test

  rust-abi-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --manifest-path packages/snow_draw_engine/rust/Cargo.toml

      - name: Build Rust C ABI release artifact
        run: cargo build --manifest-path packages/snow_draw_engine/rust/Cargo.toml -p engine_capi --release
